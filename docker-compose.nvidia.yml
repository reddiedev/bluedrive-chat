services:
  ollama:
    image: bd_ollama:latest
    container_name: bd_ollama
    profiles: ["ollama"]
    build:
      context: ./ollama        
      dockerfile: Dockerfile
    ports:
      - "${HOST_OLLAMA_PORT:-11434}:11434"
    volumes:
      - bd_ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h 
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      bd_network:
        ipv4_address: "172.28.0.10"
    healthcheck:
      test:  [ "CMD-SHELL", "bash", "-c", "{ printf >&3 'GET / HTTP/1.0\\r\\n\\r\\n'; cat <&3; } 3<>/dev/tcp/localhost/11434 | grep 'Ollama is' || exit 1"  ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1s
    deploy: # If you do not have an Nvidia GPU, remove this section
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  backend:
    image: bd_backend:latest
    container_name: bd_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${HOST_BACKEND_PORT:-8000}:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.fireworks.ai/inference/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-accounts/fireworks/models/deepseek-v4p1-flash}
      - OLLAMA_BASE_URL=http://bd_ollama:11434
      - DATABASE_URL=${DATABASE_URL}
    networks:
      bd_network:
        ipv4_address: "172.28.0.20"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1s
  frontend:
    image: bd_frontend:latest
    container_name: bd_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_KEY: ${VITE_SUPABASE_KEY}
    environment:
      - BACKEND_BASE_URL=http://bd_backend:8000
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_KEY=${VITE_SUPABASE_KEY}
    ports:
      - "${HOST_FRONTEND_PORT:-3000}:3000"
    networks:
      bd_network:
        ipv4_address: "172.28.0.40"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1s

volumes:
  bd_ollama_data:

networks:
  bd_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
